body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This form is for first-time contributors who need to be vouched before submitting pull requests.
        > Read the [Contributing Guide](https://github.com/{{OWNER}}/{{REPO}}/blob/{{DEFAULT_BRANCH}}/CONTRIBUTING.md)
        > and [AI Usage Policy](https://github.com/{{OWNER}}/{{REPO}}/blob/{{DEFAULT_BRANCH}}/AI_POLICY.md)
        > before submitting.
        >
        > Keep your request concise and write it in your own voice. Do not have AI write this request for you.
        > A maintainer will comment `!vouch` if your request is approved.
  - type: textarea
    attributes:
      label: What do you want to change?
      description: |
        Describe the change you want to make to {{PROJECT_NAME}}. Link an existing issue or discussion if one exists.
      placeholder: |
        I want to fix...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why do you want to make this change?
      description: |
        Explain why this change is useful, important, or worth reviewing.
      placeholder: |
        This matters because...
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: "I acknowledge that:"
      options:
        - label: >-
            I have read the Contributing Guide and understand the contribution process.
          required: true
        - label: >-
            I have read and agree to follow the AI Usage Policy.
          required: true
        - label: >-
            I wrote this vouch request myself, in my own voice, without AI generating it.
          required: true

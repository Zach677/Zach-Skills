"on":
  issues:
    types: [opened, reopened]

name: "Vouch - Check Issue"

permissions:
  contents: read

jobs:
  check:
    runs-on: "{{RUNNER_LABEL}}"
    steps:
      - uses: "actions/create-github-app-token@{{CREATE_GITHUB_APP_TOKEN_REF}}"
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: "actions/checkout@{{CHECKOUT_ACTION_REF}}"
        with:
          sparse-checkout: .github/issue-unvouched-message

      - uses: "mitchellh/vouch/action/check-issue@{{VOUCH_ACTION_REF}}"
        with:
          issue-number: ${{ github.event.issue.number }}
          auto-close: true
          auto-lock: true
          template-file: .github/issue-unvouched-message
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

"on":
  pull_request_target:
    types: [opened, reopened]

name: "Vouch - Check PR"

permissions:
  contents: read

jobs:
  check:
    runs-on: "{{RUNNER_LABEL}}"
    steps:
      - uses: "actions/create-github-app-token@{{CREATE_GITHUB_APP_TOKEN_REF}}"
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: "mitchellh/vouch/action/check-pr@{{VOUCH_ACTION_REF}}"
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

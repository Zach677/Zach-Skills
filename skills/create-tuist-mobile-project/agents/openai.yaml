interface:
  display_name: "Create Tuist Mobile Project"
  short_description: "Drive capability detection, blocker reporting, approvals, and JSON handoff for creating a Tuist mobile project."
  default_prompt: "Use $create-tuist-mobile-project when a user wants to create a new pure iOS or iOS-plus-Catalyst project from a public template. Ask one question at a time. For discrete branches, present short labeled choices and wait for a single answer before moving on. Do not ask for mode and template in the same turn, and do not ask for comma-separated multi-field replies. The current helper layer detects tooling (git, gh, gh auth status, mise, tuist, tuist auth whoami), surfaces blocked modes, defines the approval shape for GitHub/Tuist side effects, assembles the in-memory payload for bin/zach-mobile-init --config <path-to-json-config>, and exposes reusable side-effect sequencing for the later interview wiring."

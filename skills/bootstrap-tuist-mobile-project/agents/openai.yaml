interface:
  display_name: "Bootstrap Tuist Mobile Project"
  short_description: "Drive capability detection, blocker reporting, approvals, and JSON handoff for bootstrapping a Tuist mobile project."
  default_prompt: "Use $bootstrap-tuist-mobile-project when a user wants to create a new pure iOS or iOS-plus-Catalyst project from a public template; the current helper layer detects tooling (git, gh, gh auth status, mise, tuist, tuist auth whoami), surfaces blocked modes, defines the approval shape for GitHub/Tuist side effects, and assembles the in-memory payload that later tasks will serialize for bin/zach-mobile-init --config <path-to-json-config>."
